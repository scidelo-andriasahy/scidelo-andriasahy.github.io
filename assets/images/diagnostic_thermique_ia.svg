<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="50%" stop-color="#131129"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="thermalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="35%" stop-color="#be123c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="hotspot" cx="0.6" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#311042"/>
    </radialGradient>
    <pattern id="gridIa" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="url(#bgIa)"/>
  <rect width="1200" height="720" fill="url(#gridIa)"/>

  <!-- Header -->
  <rect x="50" y="36" width="1100" height="68" rx="14" fill="rgba(15,23,42,0.9)" stroke="rgba(249,115,22,0.45)" stroke-width="1.5"/>
  <circle cx="85" cy="70" r="8" fill="#f97316"/>
  <text x="110" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">DIAGNOSTIC PAR IMAGERIE THERMIQUE &amp; IA EMBARQUÉE (MARKOV vs CNN)</text>
  <text x="110" y="88" fill="#94a3b8" font-family="monospace" font-size="14">Capteurs Infrarouges • Modèles de Markov vs CNN • Nœuds IoT Edge • Maintenance Prédictive</text>

  <!-- Left: Thermal Acquisition -->
  <g transform="translate(50, 140)">
    <rect width="340" height="525" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(249,115,22,0.4)" stroke-width="1.5"/>
    <text x="170" y="38" text-anchor="middle" fill="#fb923c" font-family="system-ui, sans-serif" font-size="16" font-weight="700">1. ACQUISITION THERMOGRAPHIQUE</text>
    <rect x="40" y="60" width="260" height="190" rx="14" fill="url(#hotspot)" stroke="#f97316" stroke-width="2"/>
    <rect x="145" y="105" width="75" height="75" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="5,3"/>
    <text x="182" y="96" text-anchor="middle" fill="#fef08a" font-family="monospace" font-size="12" font-weight="700">ΔT = +38.4°C [ROIs]</text>

    <rect x="28" y="275" width="284" height="100" rx="10" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
    <text x="45" y="305" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Prétraitement &amp; Segmentation</text>
    <text x="45" y="330" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Filtrage du bruit radiométrique</text>
    <text x="45" y="352" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Extraction des points chauds (Hotspots)</text>

    <rect x="28" y="395" width="284" height="100" rx="10" fill="#1e293b" stroke="rgba(148,163,184,0.2)"/>
    <text x="45" y="425" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Caractéristiques Thermiques</text>
    <text x="45" y="450" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Gradients spatiaux &amp; histogrammes</text>
    <text x="45" y="472" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• Séries temporelles d'échauffement</text>
  </g>

  <!-- Center: Comparative AI (Markov vs CNN) -->
  <g transform="translate(430, 140)">
    <rect width="340" height="525" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
    <text x="170" y="38" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">2. ÉTUDE COMPARATIVE IA</text>

    <!-- Markov Box -->
    <rect x="28" y="65" width="284" height="205" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="45" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Approche A : Modèles de Markov</text>
    <text x="45" y="122" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Chaînes / Champs de Markov (HMM/MRF)</text>
    <text x="45" y="146" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Modélisation probabiliste des transitions</text>
    <text x="45" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Très faible empreinte mémoire RAM/CPU</text>
    <rect x="45" y="190" width="250" height="60" rx="8" fill="#090d16"/>
    <text x="170" y="216" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="12">P(S_t | S_{t-1}) — Transition Matrix</text>
    <text x="170" y="236" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12">Idéal Ultra-Low-Power MCU</text>

    <!-- CNN Box -->
    <rect x="28" y="290" width="284" height="205" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="45" y="320" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Approche B : Réseau Convolutif (CNN)</text>
    <text x="45" y="347" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Extraction automatique de motifs 2D</text>
    <text x="45" y="371" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Classification multi-classes de défauts</text>
    <text x="45" y="395" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Quantification &amp; optimisation Edge AI</text>
    <rect x="45" y="415" width="250" height="60" rx="8" fill="#090d16"/>
    <text x="170" y="441" text-anchor="middle" fill="#d8b4fe" font-family="monospace" font-size="12">Conv2D &rarr; ReLU &rarr; Pool &rarr; Softmax</text>
    <text x="170" y="461" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12">Haute Précision Spatiale</text>
  </g>

  <!-- Right: IoT Edge Deployment & Predictive Maintenance -->
  <g transform="translate(810, 140)">
    <rect width="340" height="525" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
    <text x="170" y="38" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="700">3. DÉPLOIEMENT NŒUDS IoT</text>

    <rect x="28" y="65" width="284" height="135" rx="12" fill="#1e293b" stroke="rgba(16,185,129,0.35)"/>
    <text x="45" y="98" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Inférence Embarquée Temps Réel</text>
    <text x="45" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Exécution locale sur nœuds IoT</text>
    <text x="45" y="148" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Détection précoce de surchauffes</text>
    <text x="45" y="171" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Latence minimale &amp; autonomie réseau</text>

    <rect x="28" y="220" width="284" height="135" rx="12" fill="#1e293b" stroke="rgba(16,185,129,0.35)"/>
    <text x="45" y="253" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Maintenance Prédictive 4.0</text>
    <text x="45" y="280" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Remontée d'alertes MQTT / Télémétrie</text>
    <text x="45" y="303" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Diagnostic d'anomalies électriques/méca.</text>
    <text x="45" y="326" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• Aide à la décision opérateur</text>

    <rect x="28" y="375" width="284" height="120" rx="12" fill="rgba(16,185,129,0.1)" stroke="#10b981"/>
    <text x="170" y="410" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Smart Automation Technologies</text>
    <text x="170" y="438" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="13">Stage R&amp;D IA &amp; IoT (PFA — 2026)</text>
    <text x="170" y="465" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">Python • C/C++ • Edge IoT • Thermal AI</text>
  </g>
</svg>
